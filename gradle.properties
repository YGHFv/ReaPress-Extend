# Gradle / Kotlin 构建配置（项目级）
#
# 背景：与同机另一个模块（阅微补全）同样的约束 —— Kotlin 编译守护进程默认堆
#       不足以编译 miuix 0.9.4 + Compose 1.12.0 这套栈，:app:compileDebugKotlin
#       会抛 "OutOfMemoryError: GC overhead limit exceeded"。这里显式加大。

# Gradle 守护进程 JVM 参数（堆 + 元空间 + 编码）
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Kotlin 编译守护进程堆
kotlin.daemon.jvmargs=-Xmx3g -Dfile.encoding=UTF-8

# 复用构建缓存，加速后续增量构建
org.gradle.caching=true

# Compose / activity-compose 属于 AndroidX 构件，缺这个开关 Gradle 会拒绝解析
android.useAndroidX=true

# 本模块的源码全部是 UTF-8（含中文注释与字符串资源）
android.enableJetifier=false
